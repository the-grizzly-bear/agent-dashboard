<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/extra.css" />
</head>
<body>
  <button class="hamburger-btn" id="sidebar-toggle" title="Toggle sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>

  <nav class="sidebar" id="sidebar">
    <button class="icon-rail-btn rail-new-chat" id="new-chat-btn" title="New Chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span class="nav-label">New Chat</span>
    </button>

    <button class="icon-rail-btn" id="agents-btn" title="Agents">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span class="nav-label">Agents</span>
    </button>

    <button class="icon-rail-btn" id="memory-btn" title="Memory">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"></path></svg>
      <span class="nav-label">Memory</span>
    </button>

    <button class="icon-rail-btn" id="theme-btn" title="Theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20 5 5 0 0 0 5-5 3 3 0 0 0-3-3h-2a3 3 0 0 1-3-3 5 5 0 0 1 5-5"></path></svg>
      <span class="nav-label">Theme</span>
    </button>

    <button class="icon-rail-btn" id="settings-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span class="nav-label">Settings</span>
    </button>

    <div class="chat-list-section">
      <div class="chat-list-label nav-label">Chats</div>
      <ul id="chat-list" class="chat-list"></ul>
    </div>
  </nav>

  <div class="chat-container welcome-active" id="chat-container">
    <div class="chat-top-bar">
      <span id="chat-title"></span>
      <div class="chat-top-actions" id="chat-top-actions">
        <span id="chat-status-badge" class="chat-status-badge hidden"></span>
        <button type="button" id="stop-chat-btn" class="chat-top-btn hidden" title="Stop">Stop</button>
        <button type="button" id="resume-chat-btn" class="chat-top-btn hidden" title="Resume">Resume</button>
        <button type="button" id="rename-chat-btn" class="chat-top-btn hidden" title="Rename">Rename</button>
        <button type="button" id="delete-chat-btn" class="chat-top-btn chat-top-btn-danger hidden" title="Delete">Delete</button>
      </div>
    </div>

    <div class="chat-history" id="chat-history">
      <div id="welcome-screen"></div>
    </div>

    <div class="chat-input-bar">
      <div class="chat-input-toolbar">
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" class="mode-toggle-btn active" data-mode="chat">Chat</button>
          <button type="button" class="mode-toggle-btn" data-mode="consensus">Consensus</button>
        </div>
        <select id="model-select" class="model-select"></select>
      </div>
      <form class="chat-input-top" id="message-form">
        <textarea id="chat-input" rows="2" placeholder="Message ..."></textarea>
        <button type="submit" class="send-btn" id="send-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="theme-modal-backdrop">
    <div class="theme-modal" id="theme-modal">
      <div class="theme-modal-header">
        <span>Theme</span>
        <button class="theme-modal-close" id="theme-modal-close" title="Close">&times;</button>
      </div>
      <div class="theme-modal-grid" id="theme-modal-grid"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="memory-modal-backdrop">
    <div class="theme-modal" id="memory-modal">
      <div class="theme-modal-header">
        <span>Memory</span>
        <button class="theme-modal-close" id="memory-modal-close" title="Close">&times;</button>
      </div>
      <div class="simple-modal-body">
        <form id="memory-form" class="memory-add-form">
          <input id="memory-topic-input" type="text" placeholder="Topic (e.g. GWRS) — optional" class="memory-topic-input" />
          <input id="memory-input" type="text" placeholder="type: fact — full context, e.g. fact: GWRS insider bought 100k shares at $25 on 2026-08-01" />
          <button type="submit" class="primary-btn">Add</button>
        </form>
        <div id="memory-list"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="settings-modal-backdrop">
    <div class="theme-modal" id="settings-modal">
      <div class="theme-modal-header">
        <span>Settings</span>
        <button class="theme-modal-close" id="settings-modal-close" title="Close">&times;</button>
      </div>
      <div class="simple-modal-body">
        <form id="settings-form" class="settings-form-simple">
          <label>Ollama host<input id="setting-ollama-host" type="text" placeholder="http://localhost:11434" /></label>
          <label>
            Global rules (guardrails applied to every agent/chat — e.g. "always respond in English")
            <textarea id="setting-global-rules" rows="3" placeholder="One rule per line…"></textarea>
          </label>
          <label>
            Unusual Whales bearer token (from a logged-in browser session's request headers)
            <input id="setting-uw-bearer-token" type="text" placeholder="l-..." />
          </label>
          <label>
            Unusual Whales uw-sh header value
            <input id="setting-uw-sh" type="text" placeholder="uw-sh value" />
          </label>
          <div class="settings-form-actions">
            <button type="submit" class="primary-btn">Save</button>
          </div>
        </form>

        <h3 class="settings-subhead">Downloaded Models</h3>
        <div class="model-pull-row">
          <input id="pull-model-input" type="text" placeholder="model name, e.g. llama3.1" />
          <button type="button" id="pull-model-btn">Pull</button>
          <span id="pull-status"></span>
        </div>
        <ul id="settings-model-list" class="settings-model-list"></ul>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="agents-modal-backdrop">
    <div class="theme-modal" id="agents-modal">
      <div class="theme-modal-header">
        <span>Agents</span>
        <button class="theme-modal-close" id="agents-modal-close" title="Close">&times;</button>
      </div>
      <div class="simple-modal-body" id="agents-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="participant-modal-backdrop">
    <div class="theme-modal" id="participant-modal">
      <div class="theme-modal-header">
        <span>Select Participants</span>
        <button class="theme-modal-close" id="participant-modal-close" title="Close">&times;</button>
      </div>
      <div class="simple-modal-body">
        <ul id="participant-list" class="settings-model-list"></ul>
        <button type="button" id="participant-start-btn" class="primary-btn participant-start-btn">Start Consensus Chat</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="confirm-modal-backdrop">
    <div class="theme-modal confirm-modal" id="confirm-modal">
      <div class="theme-modal-header">
        <span id="confirm-modal-title">Confirm</span>
        <button class="theme-modal-close" id="confirm-modal-close" title="Close">&times;</button>
      </div>
      <div class="simple-modal-body">
        <div class="confirm-modal-message" id="confirm-modal-message"></div>
        <div class="confirm-modal-actions">
          <button type="button" class="secondary-btn" id="confirm-modal-no">Cancel</button>
          <button type="button" class="chat-top-btn-danger primary-btn" id="confirm-modal-yes">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
